[package]
name = "micforge-dsp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
nnnoiseless = { version = "0.5.2", default-features = false }
rustfft = "6"

[dev-dependencies]
criterion = "0.5"

[features]
default = ["pitch"]
# Zincirdeki bağımsız perde kaydırma (PitchShifter) aşamasını etkinleştirir;
# kapalıyken bu aşama devre dışı kalır. "Derin ses" (VoiceChanger::Deep) bu
# özelliğe bağlı değildir, her zaman kendi perde kaydırıcısıyla çalışır.
pitch = []

[[bench]]
name = "chain"
harness = false
